<title>Order of Honor Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans+SC:wght@500;700&family=Alegreya:ital,wght@0,400;0,500;1,400&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }

  /* Layout: a single war-banner column. The crest sits on top, the countdown is forged beneath it,
     a diamond-capped strip carries the start date. One deliberate dark world, taken from the logo. */
  :root {
    --char: #120b09;
    --soot: #1e1411;
    --iron: #4b3830;
    --bone: #f0e3c9;
    --ash: #b09d8d;
    --ember: #ff8f42;
    --blood: #c0242a;

    --font-display: "Cinzel", "Trajan Pro", Georgia, "Times New Roman", serif;
    --font-label: "Alegreya Sans SC", "Trebuchet MS", "Segoe UI", sans-serif;
    --font-body: "Alegreya", Georgia, "Times New Roman", serif;

    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { min-height: 100%; }
  body {
    background: var(--char);
    color: var(--bone);
    font-family: var(--font-body);
    font-size: 1rem;
    line-height: 1.5;
    overflow-x: hidden;
  }

  .bg {
    position: fixed;
    inset: 0;
    z-index: -2;
    background: var(--char) url("data:image/webp;base64,UklGRrgBAABXRUJQVlA4IKwBAACwEACdASpgAGAAPm0skkY1IqqhLxaa8qANiWUAw9/RFy8MuciFrvFLTo7UE7EC9qNLU3H1n9BA02/HphOLsIag7ThRzVe3Rx4x2opVdwYsRoZT3wy5qPa2Gdb/xRHfb2L5O+zaMB2bX/DHLN0SavMGblsb+z0BZIxBtQfEOrs6dzXeSAKZg6p94cK4HFrAAP76KBnRbrvAp7QTB9zqaDi23Xe1HloI3BmPFSezl1hyi6vMgBMEKUiyPBmjCrMoPAuw7chh94H5wd8ZP0NenOv8iyk0W6y/DC+k+EMtP29neme7JIIiee6nO6/hvc65N6rkOMEFyqm0a41vrsXF5e3Aea6GhyMswTub2bLQbgQ2x1+Lvuwe80nVti104mEGoGlHhzmwnKlsEXSTAd0Oz4fiUbgQ1+CKZ7hcBlsDF7zExqSAOreFll4gvL7uOQ830WNjtN+emm46hWbt+UDue7rArbL9/+QTqg3m59nHT2Eu94htVxGB6YCE7+e4DKsh1tKAIqhbQLIIPLSriQjPFEVlr619UB3HK4W7YvZkoJnwREcsbJBxm7eImwAAAA==") center 30% / cover no-repeat;
    filter: blur(28px) brightness(0.5) saturate(1.25);
    transform: scale(1.2);
  }
  .vignette {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      radial-gradient(ellipse 80% 60% at 50% 32%, transparent 0%, color-mix(in srgb, var(--char) 55%, transparent) 55%, var(--char) 92%);
    pointer-events: none;
  }
  #embers {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding-block: clamp(12px, 3vh, 40px) clamp(28px, 6vh, 64px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(18px, 3.2vh, 30px);
    text-align: center;
  }

  .crest {
    margin: 0;
    width: min(100%, 540px);
    line-height: 0;
  }
  .crest img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 7%, #000 90%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0%, #000 9%, #000 91%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 7%, #000 90%, transparent 100%);
    mask-composite: intersect;
  }

  .count {
    width: 100%;
    max-width: 580px;
    margin-top: clamp(-28px, -3vh, -8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .lead {
    margin: 0;
    font-family: var(--font-label);
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ash);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .lead::before, .lead::after {
    content: "";
    width: 34px;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--blood));
  }
  .lead::after { transform: scaleX(-1); }

  .units {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
  .unit {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding-inline: 4px;
    min-width: 0;
  }
  .unit + .unit::before {
    content: "";
    position: absolute;
    left: 0;
    top: 8%;
    bottom: 22%;
    width: 1px;
    background: linear-gradient(to bottom, transparent, var(--iron), transparent);
  }
  .num {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2.4rem, 11vw, 4.6rem);
    line-height: 1;
    font-variant-numeric: tabular-nums lining-nums;
    color: var(--bone);
    text-shadow:
      0 0 22px color-mix(in srgb, var(--ember) 45%, transparent),
      0 2px 0 var(--char);
  }
  .unit.sec .num { color: var(--ember); }
  .lbl {
    font-family: var(--font-label);
    font-weight: 500;
    font-size: clamp(0.66rem, 2.6vw, 0.8rem);
    letter-spacing: clamp(0.06em, 0.6vw, 0.18em);
    text-transform: uppercase;
    color: var(--ash);
  }

  .done {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: clamp(-24px, -3vh, -8px);
  }
  .done-title {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(2rem, 9vw, 3.6rem);
    line-height: 1.1;
    text-wrap: balance;
    color: var(--ember);
    text-shadow: 0 0 26px color-mix(in srgb, var(--ember) 50%, transparent);
  }
  .done-sub {
    margin: 0;
    font-size: 1.15rem;
    color: var(--bone);
  }

  .when {
    position: relative;
    width: 100%;
    max-width: 460px;
    padding: 22px 8px 4px;
    border-top: 1px solid var(--iron);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .when::before {
    content: "";
    position: absolute;
    top: -6px;
    left: 50%;
    width: 10px;
    height: 10px;
    background: var(--blood);
    border: 1px solid var(--ember);
    transform: translateX(-50%) rotate(45deg);
  }
  .when-label {
    font-family: var(--font-label);
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ember);
  }
  .when time {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.02rem, 4.2vw, 1.25rem);
    line-height: 1.35;
    color: var(--bone);
    text-wrap: balance;
  }
  .when-tz, .local {
    margin: 0;
    font-size: 0.95rem;
    color: var(--ash);
  }
  .local { font-style: italic; }

  footer {
    font-family: var(--font-label);
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: color-mix(in srgb, var(--blood) 70%, var(--ash));
  }

  @media (prefers-reduced-motion: reduce) {
    #embers { display: none; }
  }
</style>
</head>

  <section class="count" id="count" role="timer" aria-label="Zeit bis zum Release">
    <p class="lead">Bis zum Release</p>
    <div class="units">
      <div class="unit"><span class="num" id="d">00</span><span class="lbl">Tage</span></div>
      <div class="unit"><span class="num" id="h">00</span><span class="lbl">Stunden</span></div>
      <div class="unit"><span class="num" id="m">00</span><span class="lbl">Minuten</span></div>
      <div class="unit sec"><span class="num" id="s">00</span><span class="lbl">Sekunden</span></div>
    </div>
  </section>

  <section class="done" id="done" hidden>
    <p class="done-title">Es ist so weit</p>
    <p class="done-sub">Der Release ist da. Wir sehen uns im Spiel.</p>
  </section>

  <div class="when">
    <span class="when-label">Start</span>
    <time id="when" datetime="2026-11-05T00:00:00+01:00">Donnerstag, 5. November 2026 · 00:00 Uhr</time>
    <p class="when-tz">deutsche Zeit (MEZ)</p>
    <p class="local" id="local" hidden></p>
  </div>

  <footer>Lok'tar Ogar</footer>
</main>

<script>
(function () {
  // 5. November 2026, 00:00 Uhr MEZ (UTC+1) = 4. November 2026, 23:00 UTC
  var TARGET = Date.UTC(2026, 10, 4, 23, 0, 0);

  var els = {
    d: document.getElementById('d'),
    h: document.getElementById('h'),
    m: document.getElementById('m'),
    s: document.getElementById('s'),
    count: document.getElementById('count'),
    done: document.getElementById('done')
  };
  var last = {};
  var timer = null;

  function pad(n) { return n < 10 ? '0' + n : String(n); }
  function set(key, val) {
    if (last[key] !== val) { els[key].textContent = val; last[key] = val; }
  }

  function tick() {
    clearTimeout(timer);
    var diff = TARGET - Date.now();
    if (diff <= 0) {
      els.count.hidden = true;
      els.done.hidden = false;
      return;
    }
    var sec = Math.floor(diff / 1000);
    set('d', pad(Math.floor(sec / 86400)));
    set('h', pad(Math.floor((sec % 86400) / 3600)));
    set('m', pad(Math.floor((sec % 3600) / 60)));
    set('s', pad(sec % 60));
    timer = setTimeout(tick, (diff % 1000) + 15);
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) tick();
  });
  tick();

  // Startzeit in deutscher Zeit und, falls abweichend, in der Zeit des Betrachters
  try {
    var t = new Date(TARGET);
    var dateOpts = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    var timeOpts = { hour: '2-digit', minute: '2-digit' };
    var berlinDate = new Intl.DateTimeFormat('de-DE', Object.assign({ timeZone: 'Europe/Berlin' }, dateOpts)).format(t);
    var berlinTime = new Intl.DateTimeFormat('de-DE', Object.assign({ timeZone: 'Europe/Berlin' }, timeOpts)).format(t);
    document.getElementById('when').textContent = berlinDate + ' · ' + berlinTime + ' Uhr';

    var localDate = new Intl.DateTimeFormat('de-DE', dateOpts).format(t);
    var localTime = new Intl.DateTimeFormat('de-DE', timeOpts).format(t);
    if (localDate !== berlinDate || localTime !== berlinTime) {
      var local = document.getElementById('local');
      local.textContent = 'Bei dir: ' + localDate + ', ' + localTime + ' Uhr';
      local.hidden = false;
    }
  } catch (e) { /* statischer Text bleibt stehen */ }

  // Aufsteigende Glut im Hintergrund
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('embers');
  var ctx = canvas.getContext && canvas.getContext('2d');
  if (reduce || !ctx) return;

  var W = 0, H = 0, dpr = 1, parts = [], raf = 0, prev = 0;

  function spawn(p, initial) {
    p.x = Math.random() * W;
    p.y = initial ? Math.random() * H : H + Math.random() * 40 * dpr;
    p.r = (0.6 + Math.random() * 1.7) * dpr;
    p.vy = (14 + Math.random() * 38) * dpr;
    p.sway = (6 + Math.random() * 16) * dpr;
    p.freq = 0.4 + Math.random() * 1.2;
    p.phase = Math.random() * Math.PI * 2;
    p.hue = 14 + Math.random() * 24;
    p.life = 0;
    p.max = 4 + Math.random() * 7;
    return p;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.round(window.innerWidth * dpr);
    H = canvas.height = Math.round(window.innerHeight * dpr);
    var n = Math.max(26, Math.min(90, Math.round(window.innerWidth / 9)));
    parts = [];
    for (var i = 0; i < n; i++) parts.push(spawn({}, true));
  }

  function frame(ts) {
    var dt = prev ? Math.min((ts - prev) / 1000, 0.05) : 0.016;
    prev = ts;
    ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      p.life += dt;
      p.y -= p.vy * dt;
      var x = p.x + Math.sin(p.phase + p.life * p.freq) * p.sway;
      var k = p.life / p.max;
      var a = Math.max(0, Math.min(1, k * 4) * (1 - k)) * (0.75 + Math.random() * 0.25);
      if (k >= 1 || p.y < -20) { spawn(p, false); continue; }
      ctx.fillStyle = 'hsla(' + p.hue + ',100%,55%,' + (a * 0.11) + ')';
      ctx.beginPath(); ctx.arc(x, p.y, p.r * 2.6, 0, 6.283); ctx.fill();
      ctx.fillStyle = 'hsla(' + (p.hue + 12) + ',100%,70%,' + (a * 0.9) + ')';
      ctx.beginPath(); ctx.arc(x, p.y, p.r, 0, 6.283); ctx.fill();
    }
    raf = requestAnimationFrame(frame);
  }

  function start() { if (!raf) { prev = 0; raf = requestAnimationFrame(frame); } }
  function stop() { cancelAnimationFrame(raf); raf = 0; }

  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', function () { document.hidden ? stop() : start(); });
  resize();
  start();
})();
</script>
